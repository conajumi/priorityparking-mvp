<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriorityParking - Panel Inmediato</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 700px; background: white; margin: 30px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #003366; padding-bottom: 15px; margin-bottom: 20px; }
        h2 { color: #003366; margin: 0; }
        .btn-logout { background: #ef4444; color: white; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .alert { padding: 12px; margin-bottom: 20px; border-radius: 6px; font-weight: bold; text-align: center; }
        .error { background: #fde8e8; color: #e53e3e; border: 1px solid #f8b4b4; }
        .success { background: #def7ec; color: #03543f; border: 1px solid #bcf0da; }
        .map-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .slot { border: 2px solid #ccc; padding: 25px 15px; text-align: center; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .DISPONIBLE { background: #e6fffa; border-color: #319795; color: #234e52; }
        .DISPONIBLE:hover { transform: scale(1.03); }
        .RESERVADO { background: #feebc8; border-color: #dd6b20; color: #744210; cursor: not-allowed; }
        .OCUPADO { background: #fed7d7; border-color: #e53e3e; color: #742a2a; cursor: not-allowed; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>🗺️ Reserva tu Espacio en Tiempo Real - Sede Lima Centro</h2>
            <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
        
        <p>Sesión activa: <span id="displayCodigo" style="font-weight: bold; color: #003366;"></span></p>
        
        <!-- 🔍 REEMPLAZA EL BLOQUE DE CONTROL POR ESTA CONFIGURACIÓN CON EL BOTÓN INTEGRADO -->
        <div style="margin-bottom: 20px; background: #e2e8f0; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; gap: 15px;">
            
            <!-- 📅 1. FECHA DE RESERVA PRIMERO -->
            <div>
                <label for="fechaLlegada" style="font-weight: bold; color: #003366; display: block; margin-bottom: 6px;">📅 Fecha de Reserva:</label>
                <input type="date" id="fechaLlegada" style="width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #cbd5e0; box-sizing: border-box; background: white;" readonly>
            </div>
            
            <!-- ⏰ 2. HORA DE LLEGADA SEGUNDO -->
            <div>
                <label for="horaLlegada" style="font-weight: bold; color: #003366; display: block; margin-bottom: 6px;">⏰ ¿A qué hora llegas? (20 min de tolerancia):</label>
                <input type="time" id="horaLlegada" style="width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #cbd5e0; box-sizing: border-box; background: white;">
            </div>

            <!-- ❌ 3. ACCIÓN DE CANCELACIÓN ACCESIBLE AL FINAL -->
            <div style="text-align: right; margin-top: 5px;">
                <button class="btn-cancel" onclick="cancelarMiReserva()" style="width: 100%; padding: 14px; background: #dc2626; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;">
                    ❌ Cancelar mi Reserva de esta Fecha
                </button>
            </div>

        </div>



        <div id="panelAlert" class="alert hidden"></div>
        <div class="map-grid" id="contenedorMapa">Cargando espacios...</div>
    </div>

    <script>
        const codigoAlumno = sessionStorage.getItem('alumnoLogueado');
        if (!codigoAlumno) {
            window.location.href = '/login.html';
        } else {
            document.getElementById('displayCodigo').innerText = codigoAlumno;
            configurarCamposFechaHora();
            cargarMapaWeb();
        }

        function configurarCamposFechaHora() {
            const inputFecha = document.getElementById('fechaLlegada');
            const inputHora = document.getElementById('horaLlegada');
            
            // 1. Obtener y setear la fecha local actual de Lima (Formato YYYY-MM-DD)
            const hoy = new Date();
            const formatoHoy = hoy.toLocaleDateString('sv-SE'); 
            
            // 2. Calcular la fecha máxima permitida (Mañana) para el rango de 2 días de la App UTP
            const mañana = new Date();
            mañana.setDate(mañana.getDate() + 1);
            const formatoMañana = mañana.toLocaleDateString('sv-SE');

            // Asignar restricciones y valor por defecto de fecha
            inputFecha.value = formatoHoy;
            inputFecha.min = formatoHoy;
            inputFecha.max = formatoMañana;

            // 3. Formatear y setear la hora actual local de forma limpia (Formato HH:MM)
            const horas = String(hoy.getHours()).padStart(2, '0');
            const minutos = String(hoy.getMinutes()).padStart(2, '0');
            
            // Asignar el valor por defecto de hora para eliminar el '--:--'
            if (inputHora) {
                inputHora.value = `${horas}:${minutos}`;
            }
        }

        function cerrarSesion() {
            sessionStorage.removeItem('alumnoLogueado');
            window.location.href = '/login.html';
        }

        function mostrarNotificacion(texto, tipo) {
            const box = document.getElementById('panelAlert');
            box.innerText = texto;
            box.className = `alert ${tipo}`;
            box.classList.remove('hidden');
        }

        async function cargarMapaWeb() {
            const grid = document.getElementById('contenedorMapa');
            const tokenJWT = sessionStorage.getItem('tokenSession');
            try {
                const res = await fetch('/api/garita/espacios', {
                    headers: { 'Authorization': `Bearer ${tokenJWT}` }
                });
                const espacios = await res.json();
                grid.innerHTML = '';

                espacios.forEach(espacio => {
                    const div = document.createElement('div');
                    div.className = `slot ${espacio.estado}`;
                    div.innerHTML = `<div>${espacio.id_espacio}</div><small style="font-size:11px; opacity:0.8;">${espacio.estado}</small>`;
                    
                    if(espacio.estado === 'DISPONIBLE') {
                        div.onclick = () => solicitarReservaSlot(espacio.id_espacio);
                    }
                    grid.appendChild(div);
                });
            } catch (err) {
                grid.innerHTML = '<p style="color:red;">Error de conexión.</p>';
            }
        }

        // 🚀 BUSCA Y REEMPLAZA ÚNICAMENTE ESTA FUNCIÓN EN TU INDEX.HTML:
        async function cancelarMiReserva() {
            const fechaElegida = document.getElementById('fechaLlegada').value;
            const tokenJWT = sessionStorage.getItem('tokenSession'); 

            // Guardrail de seguridad básico
            if (!fechaElegida) {
                alert('Por favor, asegúrate de seleccionar una fecha válida primero.');
                return;
            }

            // 1. Mensaje de confirmación en el navegador
            if (!confirm(`¿Estás completamente seguro de que deseas cancelar tu reserva para el día ${fechaElegida}? El espacio será liberado de inmediato.`)) {
                return; 
            }

            try {
                console.log(`[Frontend] Intentando cancelar reserva para: ${codigoAlumno} en fecha ${fechaElegida}`);

                // 2. Petición POST oficial enviando el token en la cabecera
                const res = await fetch('/api/reservas/cancelar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${tokenJWT}` // 🔑 Token obligatorio para el middleware
                    },
                    body: JSON.stringify({
                        codigo_alumno: codigoAlumno,
                        fecha_reserva: fechaElegida
                        // Nota: Asegúrate de que coincida con lo que el body de tu controlador espera
                    })
                });

                const data = await res.json();

                // 3. Si el backend responde con un error de base de datos
                if (!res.ok) {
                    throw new Error(data.error || 'No se pudo procesar la cancelación en el servidor.');
                }

                // 4. Si todo sale correcto
                alert(data.mensaje || 'Reserva cancelada con éxito.');
                mostrarNotificacion(data.mensaje, 'success');
                
                // 5. Refrescar el mapa web de inmediato para pintar los slots de verde
                await cargarMapaWeb();

            } catch (err) {
                console.error('[Frontend Cancel Error]:', err.message);
                alert(`Error al cancelar: ${err.message}`);
                mostrarNotificacion(err.message, 'error');
            }
        }


        async function solicitarReservaSlot(idEspacio) {
            const fechaElegida = document.getElementById('fechaLlegada').value;
            const horaElegida = document.getElementById('horaLlegada').value;
            const tokenJWT = sessionStorage.getItem('tokenSession');

            if(!horaElegida) return alert('Por favor, ingresa una hora estimada de llegada.');
            if(!confirm(`¿Separar el slot ${idEspacio} para hoy a las ${horaElegida}?`)) return;

            try {
                const res = await fetch('/api/reservas/crear', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${tokenJWT}`
                    },
                    body: JSON.stringify({
                        codigo_alumno: codigoAlumno,
                        id_espacio: idEspacio,
                        otp_verificado: '000000',
                        fecha_reserva: fechaElegida,
                        hora_llegada: horaElegida // 🚀 Enviado dinámicamente al backend
                    })
                });
                const data = await res.json();
                if(!res.ok) throw new Error(data.error || 'Fallo al procesar tu reserva.');

                mostrarNotificacion(data.mensaje, 'success');
                cargarMapaWeb();
            } catch (err) {
                mostrarNotificacion(err.message, 'error');
            }
        }
    </script>
</body>
</html>
