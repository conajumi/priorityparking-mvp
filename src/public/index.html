<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriorityParking - Panel de Reservas</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 700px; background: white; margin: 30px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #003366; padding-bottom: 15px; margin-bottom: 20px; }
        h2 { color: #003366; margin: 0; }
        .btn-logout { background: #ef4444; color: white; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-cancel { background: #dc2626; color: white; padding: 10px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-left: 10px; font-size: 14px; transition: 0.3s; }
        .btn-cancel:hover { background: #b91c1c; }
        .alert { padding: 12px; margin-bottom: 20px; border-radius: 6px; font-weight: bold; text-align: center; }
        .error { background: #fde8e8; color: #e53e3e; border: 1px solid #f8b4b4; }
        .success { background: #def7ec; color: #03543f; border: 1px solid #bcf0da; }
        .map-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .slot { border: 2px solid #ccc; padding: 25px 15px; text-align: center; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .DISPONIBLE { background: #e6fffa; border-color: #319795; color: #234e52; }
        .DISPONIBLE:hover { transform: scale(1.03); }
        .RESERVADO { background: #feebc8; border-color: #dd6b20; color: #744210; cursor: not-allowed; }
        .OCUPADO { background: #fed7d7; border-color: #e53e3e; color: #742a2a; cursor: not-allowed; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>🗺️ Reserva tu Espacio - Sede Lima Centro</h2>
            <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
        
        <p>Sesión activa: <span id="displayCodigo" style="font-weight: bold; color: #003366;"></span></p>
        
        <!-- 📅 Control de Fecha y Cancelación Activa -->
        <div style="margin-bottom: 20px; background: #e2e8f0; padding: 15px; border-radius: 8px; display: flex; align-items: flex-end; justify-content: space-between;">
            <div style="flex-grow: 1;">
                <label for="fechaLlegada" style="font-weight: bold; color: #003366; display: block; margin-bottom: 5px;">Fecha de Llegada (24h de anticipación):</label>
                <input type="date" id="fechaLlegada" style="width: 100%; padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #cbd5e0; box-sizing: border-box;">
            </div>
            <button class="btn-cancel" onclick="cancelarMiReserva()">❌ Cancelar Reserva</button>
        </div>

        <div id="panelAlert" class="alert hidden"></div>
        <div class="map-grid" id="contenedorMapa">Cargando espacios...</div>
    </div>

    <script>
        const codigoAlumno = sessionStorage.getItem('alumnoLogueado');
        if (!codigoAlumno) {
            window.location.href = '/login.html';
        } else {
            document.getElementById('displayCodigo').innerText = codigoAlumno;
            configurarCalendario24h();
            cargarMapaWeb();
        }

        function configurarCalendario24h() {
            const inputFecha = document.getElementById('fechaLlegada');
            const mañana = new Date();
            mañana.setDate(mañana.getDate() + 1); 
            
            const formatoFecha = mañana.toISOString().split('T')[0];
            inputFecha.value = formatoFecha;
            inputFecha.min = formatoFecha; 
            inputFecha.max = formatoFecha; 
        }

        function cerrarSesion() {
            sessionStorage.removeItem('alumnoLogueado');
            sessionStorage.removeItem('tokenSession');
            window.location.href = '/login.html';
        }

        function mostrarNotificacion(texto, tipo) {
            const box = document.getElementById('panelAlert');
            box.innerText = texto;
            box.className = `alert ${tipo}`;
            box.classList.remove('hidden');
        }

        async function cargarMapaWeb() {
            const grid = document.getElementById('contenedorMapa');
            const tokenJWT = sessionStorage.getItem('tokenSession'); 

            try {
                const res = await fetch('/api/garita/espacios', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${tokenJWT}`
                    }
                });

                if (res.status === 401 || res.status === 403) throw new Error('Sesión no autorizada por token.');
                if (!res.ok) throw new Error('No se pudo leer la lista de espacios');
                
                const espacios = await res.json();
                grid.innerHTML = '';

                espacios.forEach(espacio => {
                    const div = document.createElement('div');
                    div.className = `slot ${espacio.estado}`;
                    div.innerHTML = `<div>${espacio.id_espacio}</div><small style="font-size:11px; opacity:0.8;">${espacio.estado}</small>`;
                    
                    if(espacio.estado === 'DISPONIBLE') {
                        div.onclick = () => solicitarReservaSlot(espacio.id_espacio);
                    }
                    grid.appendChild(div);
                });
            } catch (err) {
                grid.innerHTML = `<p style="color:red; grid-column: span 3; text-align:center;">${err.message}</p>`;
            }
        }

        async function solicitarReservaSlot(idEspacio) {
            const fechaElegida = document.getElementById('fechaLlegada').value;
            const tokenJWT = sessionStorage.getItem('tokenSession'); 

            if(!confirm(`¿Confirmas separar el estacionamiento ${idEspacio} para el día ${fechaElegida}?`)) return;

            try {
                const res = await fetch('/api/reservas/crear', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${tokenJWT}`
                    },
                    body: JSON.stringify({
                        codigo_alumno: codigoAlumno,
                        id_espacio: idEspacio,
                        otp_verificado: '000000',
                        fecha_reserva: fechaElegida
                    })
                });
                const data = await res.json();
                if(!res.ok) throw new Error(data.error || 'Error al procesar reserva.');

                mostrarNotificacion(data.mensaje, 'success');
                cargarMapaWeb();
            } catch (err) {
                mostrarNotificacion(err.message, 'error');
            }
        }

        // 🚀 NUEVA FUNCIÓN: Envía la orden de cancelación con el token JWT
        async function cancelarMiReserva() {
            const fechaElegida = document.getElementById('fechaLlegada').value;
            const tokenJWT = sessionStorage.getItem('tokenSession'); 

            if(!confirm(`¿Estás seguro que deseas cancelar tu reserva para el día ${fechaElegida}? El espacio será liberado.`)) return;

            try {
                const res = await fetch('/api/reservas/cancelar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${tokenJWT}`
                    },
                    body: JSON.stringify({
                        codigo_alumno: codigoAlumno,
                        fecha_reserva: fechaElegida
                    })
                });
                const data = await res.json();
                if(!res.ok) throw new Error(data.error || 'No se pudo cancelar la reserva.');

                mostrarNotificacion(data.mensaje, 'success');
                cargarMapaWeb(); // Refrescar el mapa para que el slot vuelva a verde instantáneamente
            } catch (err) {
                mostrarNotificacion(err.message, 'error');
            }
        }
    </script>
</body>
</html>
