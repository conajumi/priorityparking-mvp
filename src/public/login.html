<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriorityParking - Login Alumnos</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; margin: 0; padding: 20px; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { max-width: 400px; width: 100%; background: #ffffff; padding: 40px 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); box-sizing: border-box; }
        .logo-title { color: #003366; text-align: center; margin-bottom: 5px; font-size: 28px; font-weight: 8xl; }
        .subtitle { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 30px; }
        .form-group { margin-bottom: 22px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #1e293b; font-size: 14px; }
        input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: #003366; outline: none; }
        button { width: 100%; padding: 14px; background: #003366; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #002244; }
        .hidden { display: none; }
        .alert { padding: 12px; margin-bottom: 20px; border-radius: 8px; font-weight: bold; font-size: 14px; text-align: center; border: 1px solid; }
        .error { background: #fde8e8; color: #e53e3e; border-color: #f8b4b4; }
        .success { background: #def7ec; color: #03543f; border-color: #bcf0da; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-title">🚗 PriorityParking</div>
        <div class="subtitle">Acceso Exclusivo para Alumnos UTP</div>
        
        <div id="alertBox" class="alert hidden"></div>

        <!-- PASO A: Solicitar código ingresando Correo -->
        <div id="groupEmail">
            <div class="form-group">
                <label for="correo">Correo Institucional</label>
                <input type="email" id="correo" placeholder="U22XXXXX@utp.edu.pe">
            </div>
            <button onclick="enviarCorreo()">Solicitar Token OTP</button>
        </div>

        <!-- PASO B: Verificar cuenta ingresando Código OTP -->
        <div id="groupOtp" class="hidden">
            <div class="form-group">
                <label for="otp">Código de Verificación (6 dígitos)</label>
                <input type="text" id="otp" placeholder="Ej: 543210" maxlength="6" style="text-align: center; font-size: 20px; letter-spacing: 5px;">
            </div>
            <button onclick="enviarOtp()" style="background: #10b981;">Validar Código e Ingresar</button>
        </div>
    </div>

    <script>
        let codigoAlumnoDetectado = '';

        function mostrarMensaje(texto, tipo) {
            const box = document.getElementById('alertBox');
            box.innerText = texto;
            box.className = `alert ${tipo}`;
            box.classList.remove('hidden');
        }

        // Ejecuta el POST a /api/auth/solicitar-otp
        async function enviarCorreo() {
            const correo = document.getElementById('correo').value.trim();
            if(!correo) return mostrarMensaje('Ingresa tu correo institucional.', 'error');

            try {
                const res = await fetch('/api/auth/solicitar-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'No se pudo enviar el código.');

                codigoAlumnoDetectado = data.codigoAlumno;
                
                // Transición visual al paso OTP
                document.getElementById('groupEmail').classList.add('hidden');
                document.getElementById('groupOtp').classList.remove('hidden');
                mostrarMensaje(data.mensaje, 'success');
            } catch (err) {
                mostrarMensaje(err.message, 'error');
            }
        }

        // Ejecuta el POST a /api/auth/verificar-otp
        async function enviarOtp() {
            const otp = document.getElementById('otp').value.trim();
            if(!otp) return mostrarMensaje('Ingresa el código OTP enviado.', 'error');

            try {
                const res = await fetch('/api/auth/verificar-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ codigoAlumno: codigoAlumnoDetectado, otp })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Código incorrecto.');

                // Guardar datos en la sesión del navegador para el panel de reservas
                sessionStorage.setItem('alumnoLogueado', codigoAlumnoDetectado);
                
                mostrarMensaje('Acceso correcto. Redireccionando...', 'success');
                
                // Redirigir al panel del mapa después de 1.5 segundos
                setTimeout(() => {
                    window.location.href = '/index.html';
                }, 1500);

            } catch (err) {
                mostrarMensaje(err.message, 'error');
            }
        }
    </script>
</body>
</html>
