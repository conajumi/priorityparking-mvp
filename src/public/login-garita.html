<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriorityParking - Acceso Garita</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a202c; margin: 0; padding: 20px; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { max-width: 400px; width: 100%; background: #2d3748; padding: 40px 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); box-sizing: border-box; border: 1px solid #4a5568; }
        .logo-title { color: #63b3ed; text-align: center; margin-bottom: 5px; font-size: 26px; font-weight: bold; }
        .subtitle { text-align: center; color: #a0aec0; font-size: 14px; margin-bottom: 30px; }
        .form-group { margin-bottom: 22px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #cbd5e0; font-size: 14px; }
        input { width: 100%; padding: 14px; background: #4a5568; border: 2px solid #718096; border-radius: 8px; box-sizing: border-box; font-size: 16px; color: white; transition: 0.3s; }
        input:focus { border-color: #63b3ed; outline: none; }
        button { width: 100%; padding: 14px; background: #3182ce; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2b6cb0; }
        .alert { padding: 12px; margin-bottom: 20px; border-radius: 8px; font-weight: bold; font-size: 14px; text-align: center; border: 1px solid; }
        .error { background: #fed7d7; color: #9b2c2c; border-color: #feb2b2; }
        .success { background: #c6f6d5; color: #22543d; border-color: #9ae6b4; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-title">👮 Control Garita</div>
        <div class="subtitle">Sistemas Internos de Seguridad - UTP</div>
        
        <div id="alertBox" class="alert hidden"></div>

        <div class="form-group">
            <label for="usuario">Credencial Operador</label>
            <input type="text" id="usuario" placeholder="Ej: UTP-GARITA">
        </div>
        <div class="form-group">
            <label for="password">Clave de Seguridad</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button onclick="autenticarGarita()">Ingresar al Monitor</button>
    </div>

    <script>
        function mostrarMensaje(texto, tipo) {
            const box = document.getElementById('alertBox');
            box.innerText = texto;
            box.className = `alert ${tipo}`;
        }

        async function autenticarGarita() {
            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value.trim();

            if(!usuario || !password) {
                return mostrarMensaje('Por favor, complete todas las credenciales.', 'error');
            }

            try {
                // Reutilizamos el endpoint /verificar-otp inyectando credenciales directas de operador
                const res = await fetch('/api/auth/verificar-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        codigoAlumno: usuario, 
                        otp: password // Enviamos la clave simétrica
                    })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Credenciales inválidas para el personal de garita.');

                // Guardar los datos del operador y el JWT firmado con rol 'GARITA'
                sessionStorage.setItem('operadorLogueado', usuario);
                sessionStorage.setItem('tokenSession', data.token);
                sessionStorage.setItem('rolUsuario', data.rol);
                
                mostrarMensaje('Autenticación de seguridad aprobada. Conectando monitor...', 'success');
                
                // Redirigir al monitor de garita oficial
                setTimeout(() => {
                    window.location.href = '/garita.html';
                }, 1500);

            } catch (err) {
                mostrarMensaje(err.message, 'error');
            }
        }
    </script>
</body>
</html>
