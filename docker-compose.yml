version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: priorityparking_db
    restart: always
    environment:
      POSTGRES_USER: utp_admin
      POSTGRES_PASSWORD: SecretPasswordUTP2026
      POSTGRES_DB: priority_parking_mvp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
